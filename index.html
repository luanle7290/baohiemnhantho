<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Google Fonts: Roboto hỗ trợ rất tốt tiếng Việt, đẹp và hiện đại -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảo Hiểm Nhân Thọ — Tuyển Dụng</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <!-- ─── SIDEBAR ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🛡️</div>
      <div class="brand-text">
        <span class="brand-main">BẢO HIỂM</span>
        <span class="brand-sub">NHÂN THỌ</span>
      </div>
    </div>

    <div class="sidebar-section-label">DANH SÁCH CÔNG TY</div>
    <nav class="sidebar-nav" id="companyNav"></nav>

    <div class="sidebar-footer">
      <div class="update-info">
        <span class="update-label">Cập nhật lần cuối</span>
        <span class="update-date" id="lastUpdated">—</span>
      </div>
    </div>
  </aside>

  <!-- ─── MAIN AREA ──────────────────────────────────────── -->
  <div class="main">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-right">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Tìm vị trí, kỹ năng..." />
        </div>
        <div class="city-filter">
          <select id="cityFilter" class="city-select">
            <option value="all">📍 Tất cả địa điểm</option>
            <option value="hcm">TP. Hồ Chí Minh</option>
            <option value="hanoi">Hà Nội</option>
            <option value="other">Tỉnh khác</option>
          </select>
        </div>
        <div class="city-filter">
          <select id="categoryFilter" class="city-select">
            <option value="all">🗂️ Tất cả bộ phận</option>
            <option value="actuarial">📊 Tài chính & Actuarial</option>
            <option value="tech">💻 Công nghệ & IT</option>
            <option value="sales">🤝 Kinh doanh & Sales</option>
            <option value="hr">👥 Nhân sự & Đào tạo</option>
            <option value="marketing">📣 Marketing & Khách hàng</option>
            <option value="strategy">🎯 Chiến lược & Dự án</option>
            <option value="legal">⚖️ Pháp lý, Tuân thủ và Rủi ro</option>
            <option value="operations">⚙️ Vận hành</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="content" id="content">
      <div class="loading">Đang tải dữ liệu...</div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
